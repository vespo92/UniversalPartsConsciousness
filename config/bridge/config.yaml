# =============================================================================
# Agent_9 BRIDGE Configuration
# Universal Parts Consciousness - Power Unification System
# =============================================================================
#
# The Connector of Worlds - Configuration for external integrations and
# power unification settings.
#
# =============================================================================

agent:
  id: AGENT_9
  codename: BRIDGE
  role: "Integration Architect"
  domain: "Power Unification"

# =============================================================================
# Power Unification Settings
# =============================================================================
unification:
  # Mesh network topology: hierarchical, fully_connected, ring, star, hybrid
  topology: hybrid

  # Coherence threshold for each unification state
  coherence_thresholds:
    synchronized: 0.5
    unified: 0.8
    transcendent: 0.95

  # Heartbeat interval for agent mesh (seconds)
  heartbeat_interval: 10

  # Connection timeout for agent connections (seconds)
  connection_timeout: 30

# =============================================================================
# Supplier Integrations
# =============================================================================
suppliers:
  enabled: true

  # Supplier configurations
  mcmaster_carr:
    enabled: true
    region: americas
    api_type: REST
    rate_limit_per_minute: 60

  grainger:
    enabled: true
    region: americas
    api_type: REST
    rate_limit_per_minute: 30

  fastenal:
    enabled: true
    region: americas
    api_type: REST
    rate_limit_per_minute: 30

  misumi:
    enabled: true
    region: asia_pacific
    api_type: REST
    rate_limit_per_minute: 60

  rs_components:
    enabled: true
    region: europe
    api_type: REST
    rate_limit_per_minute: 60

  msc_industrial:
    enabled: true
    region: americas
    api_type: REST
    rate_limit_per_minute: 30

  bossard:
    enabled: true
    region: europe
    api_type: REST
    rate_limit_per_minute: 30

  wurth:
    enabled: true
    region: europe
    api_type: REST
    rate_limit_per_minute: 30

# =============================================================================
# CAD System Integrations
# =============================================================================
cad_systems:
  enabled: true

  freecad:
    enabled: true
    plugin_version: "1.0.0"

  fusion360:
    enabled: true
    addin_version: "1.0.0"

  solidworks:
    enabled: true
    integration_version: "1.0.0"

  onshape:
    enabled: false  # Planned

  autocad:
    enabled: false  # Planned

  inventor:
    enabled: false  # Planned

# =============================================================================
# ERP/PLM Platform Integrations
# =============================================================================
erp_platforms:
  enabled: true

  sap:
    enabled: true
    modules: ["MM", "PP", "QM"]

  oracle:
    enabled: true
    cloud_version: true

  siemens_teamcenter:
    enabled: true
    version: "14.x"

  ptc_windchill:
    enabled: true

  arena_solutions:
    enabled: true

  epicor:
    enabled: true

# =============================================================================
# IoT Protocol Integrations
# =============================================================================
iot_protocols:
  enabled: true

  mqtt:
    enabled: true
    broker_host: localhost
    broker_port: 1883
    keepalive: 60

  opc_ua:
    enabled: true
    endpoint: "opc.tcp://localhost:4840"
    security_mode: None

  modbus_tcp:
    enabled: true
    default_port: 502

  can_bus:
    enabled: true
    interface: can0
    bitrate: 500000

  bluetooth_le:
    enabled: false  # Planned

  wifi_rest:
    enabled: true

# =============================================================================
# Societal Framework
# =============================================================================
societal:
  enabled: true

  # Knowledge commons access model
  knowledge_commons:
    mode: open
    rate_limits:
      free_tier: 1000  # requests per day
      premium_tier: 10000

  # Societal capabilities
  capabilities:
    building: true
    developing: true
    engineering: true
    manufacturing: true
    education: true
    repair: true
    sustainability: true

# =============================================================================
# Logging & Monitoring
# =============================================================================
logging:
  level: INFO
  format: json
  outputs:
    - console
    - file
  file_path: /app/data/logs/bridge.log
  rotation:
    max_size_mb: 100
    backup_count: 5

monitoring:
  enabled: true
  metrics_port: 9009
  health_check_interval: 30
